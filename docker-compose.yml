services:
  db:
    image: postgres:16-alpine
    container_name: poydem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poydem
      POSTGRES_PASSWORD: poydem
      POSTGRES_DB: poydem
    ports:
      - "5433:5432"
    volumes:
      - poydem-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poydem"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  poydem-pgdata:
